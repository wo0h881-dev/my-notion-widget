<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>책 수집기</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f5f5f5; padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .search-box { width: 100%; max-width: 500px; display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        button { padding: 12px 20px; background: #1f8ce6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 600px; }
        .book-card { background: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; text-align: center; position: relative; transition: transform 0.2s; }
        .book-card:active { transform: scale(0.98); }
        .book-card img { width: 100%; border-radius: 5px; margin-bottom: 8px; aspect-ratio: 2/3; object-fit: cover; background: #eee; }
        .book-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 34px; text-align: left; line-height: 1.2; }
        .book-author { font-size: 11px; color: #888; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-msg { font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="search-box">
        <input type="text" id="query" placeholder="책 제목 입력 후 엔터" onkeyup="if(event.keyCode==13){search()}">
        <button onclick="search()">검색</button>
    </div>
    <div id="results"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyN9isDZGmv3McyhLv3UGauweepo_e9sLdjYe-wpDPwatcozmoGkay4bX4anf5V0kPU/exec';

        async function search() {
            const query = document.getElementById('query').value;
            const resultsDiv = document.getElementById('results');
            if (!query) return;
            resultsDiv.innerHTML = '검색 중...';

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'search', query: query })
                });
                const data = await response.json();
                resultsDiv.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    resultsDiv.innerHTML = '결과가 없습니다.';
                    return;
                }

                data.items.forEach(item => {
                    const highResImg = item.image || 'https://via.placeholder.com/140x200?text=No+Cover';
                    const cleanTitle = item.title ? item.title.replace(/<[^>]*>?/gm, '') : '제목 없음';
                    const cleanAuthor = item.author ? item.author.replace(/<[^>]*>?/gm, '') : '저자 미상';
                    const cleanPublisher = item.publisher ? item.publisher.replace(/<[^>]*>?/gm, '') : '';
                    const category = item.category || '';

                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = `
                        <img src="${highResImg}" onerror="this.src='https://via.placeholder.com/140x200?text=Error'">
                        <div class="book-title">${cleanTitle}</div>
                        <div class="book-author">${cleanAuthor}</div>
                        <div class="status-slot"></div>
                    `;

                    (function(c, t, a, p, img, cat) {
                        c.onclick = () => sendToNotion(t, a, p, img, c, cat);
                    })(card, cleanTitle, cleanAuthor, cleanPublisher, highResImg, category);

                    resultsDiv.appendChild(card);
                });
            } catch (e) {
                resultsDiv.innerHTML = '에러 발생: ' + e.message;
            }
        }

        async function sendToNotion(title, author, publisher, img, cardElement, category) {
            const statusSlot = cardElement.querySelector('.status-slot');
            cardElement.style.opacity = '0.6';
            cardElement.style.pointerEvents = 'none';
            statusSlot.innerHTML = '<div class="status-msg" style="color:#1f8ce6;">등록 중...</div>';

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'update',
                        title: title,
                        author: author,
                        publisher: publisher,
                        cover: img,
                        category: category
                    })
                });

                const data = await res.json();
                if (data.ok) {
                    statusSlot.innerHTML = `<div class="status-msg" style="color:green;">✅ ${data.message || '완료!'}</div>`;
                } else {
                    statusSlot.innerHTML = `<div class="status-msg" style="color:red;">❌ ${data.message || '실패'}</div>`;
                    cardElement.style.opacity = '1';
                    cardElement.style.pointerEvents = 'auto';
                }
            } catch (e) {
                statusSlot.innerHTML = '<div class="status-msg" style="color:red;">❌ 오류 발생</div>';
                cardElement.style.opacity = '1';
                cardElement.style.pointerEvents = 'auto';
            }
        }
    </script>
</body>
</html>
